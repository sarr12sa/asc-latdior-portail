<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASC LATDIOR — Portail des membres</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="scoreboard">
  <div class="scoreboard-top">
    <div class="crest">AL</div>
    <div>
      <h1>ASC LATDIOR</h1>
      <p class="sub">Portail des membres — Khombole</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="panel">
    <h2 class="section-title">Connexion</h2>
    <div class="error-msg" id="errorBox"></div>

    <form id="loginForm">
      <label class="field-label" for="email">Adresse email</label>
      <input type="email" id="email" required placeholder="toi@exemple.com">

      <label class="field-label" for="password">Mot de passe</label>
      <input type="password" id="password" required placeholder="••••••••">

      <button type="submit" class="btn">Se connecter</button>
    </form>

    <p class="help-text">Pas encore de compte ? <a href="#" id="showSignup">Créer un accès membre</a></p>
  </div>

  <div class="panel" id="signupPanel" style="display:none;">
    <h2 class="section-title">Créer un accès membre</h2>
    <form id="signupForm">
      <label class="field-label" for="fullName">Nom complet</label>
      <input type="text" id="fullName" required placeholder="Ex : Modou Fall">

      <label class="field-label" for="suEmail">Adresse email</label>
      <input type="email" id="suEmail" required>

      <label class="field-label" for="suPassword">Mot de passe (6 caractères min.)</label>
      <input type="password" id="suPassword" required minlength="6">

      <button type="submit" class="btn btn-clay">Créer mon compte</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const errorBox = document.getElementById('errorBox');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}

document.getElementById('showSignup').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('signupPanel').style.display = 'block';
});

// Connexion
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    await auth.signInWithEmailAndPassword(email, password);
    window.location.href = 'dashboard.html';
  } catch (err) {
    showError("Connexion impossible : vérifie ton email et ton mot de passe.");
  }
});

// Inscription — crée le compte + sa fiche membre dans Firestore
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  const fullName = document.getElementById('fullName').value;
  const email = document.getElementById('suEmail').value;
  const password = document.getElementById('suPassword').value;

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('membres').doc(cred.user.uid).set({
      nom: fullName,
      email: email,
      role: 'membre',
      cotisationMontant: 5000,
      cotisationPaye: 0,
      hasAccount: true,
      dateInscription: new Date().toISOString()
    });
    window.location.href = 'dashboard.html';
  } catch (err) {
    showError("Impossible de créer le compte : " + (err.message || "réessaie."));
  }
});

// Si déjà connecté, va directement au tableau de bord
auth.onAuthStateChanged((user) => {
  if (user) window.location.href = 'dashboard.html';
});
</script>

</body>
</html>
