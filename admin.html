<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panneau du bureau — ASC LATDIOR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="scoreboard">
  <div class="top-nav" style="position:relative; z-index:1;">
    <div class="scoreboard-top">
      <div class="crest">AL</div>
      <div>
        <h1 style="font-size:22px;">Panneau du bureau</h1>
        <p class="sub">Gestion des membres — ASC LATDIOR</p>
      </div>
    </div>
    <a href="dashboard.html" class="logout-link">← Mon espace</a>
  </div>
</header>

<div class="wrap">

  <div id="accessDenied" class="panel" style="display:none;">
    <p>Cet espace est réservé au bureau. <a href="dashboard.html">Retour à mon espace</a></p>
  </div>

  <div id="adminContent" style="display:none;">

    <div class="tabs">
      <button class="tab-btn active" data-tab="membres">Membres</button>
      <button class="tab-btn" data-tab="ajouter">Marquer présence</button>
    </div>

    <div class="tab-panel active" id="tab-membres">
      <div class="panel">
        <h2 class="section-title">Liste des membres</h2>
        <table class="list">
          <thead>
            <tr><th>Nom</th><th>Cotisation</th><th></th></tr>
          </thead>
          <tbody id="membersTable"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="tab-ajouter">
      <div class="panel">
        <h2 class="section-title">Enregistrer une présence</h2>
        <form id="presenceForm">
          <label class="field-label" for="memberSelect">Membre</label>
          <select id="memberSelect" required></select>

          <label class="field-label" for="eventName">Activité</label>
          <input type="text" id="eventName" required placeholder="Ex : Match Navétane vs Diass">

          <label class="field-label" for="eventDate">Date</label>
          <input type="text" id="eventDate" required placeholder="JJ/MM/AAAA">

          <button type="submit" class="btn">Enregistrer</button>
        </form>
      </div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let allMembers = [];

auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = 'index.html'; return; }

  const myDoc = await db.collection('membres').doc(user.uid).get();
  if (!myDoc.exists || myDoc.data().role !== 'admin') {
    document.getElementById('accessDenied').style.display = 'block';
    return;
  }

  document.getElementById('adminContent').style.display = 'block';
  await loadMembers();
});

async function loadMembers() {
  const snap = await db.collection('membres').get();
  allMembers = [];
  const tbody = document.getElementById('membersTable');
  const select = document.getElementById('memberSelect');
  tbody.innerHTML = '';
  select.innerHTML = '';

  snap.forEach(doc => {
    const d = doc.data();
    allMembers.push({ id: doc.id, ...d });

    const opt = document.createElement('option');
    opt.value = doc.id;
    opt.textContent = d.nom;
    select.appendChild(opt);

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${d.nom}</td>
      <td><span class="tag ${d.cotisationAJour ? 'paid' : 'due'}">${d.cotisationAJour ? 'À jour' : 'En attente'}</span></td>
      <td><button data-id="${doc.id}" data-status="${!d.cotisationAJour}" class="toggle-cotis btn-secondary btn" style="width:auto; padding:6px 10px; font-size:12px;">Basculer</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.querySelectorAll('.toggle-cotis').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const newStatus = btn.dataset.status === 'true';
      await db.collection('membres').doc(id).update({ cotisationAJour: newStatus });
      await loadMembers();
    });
  });
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('presenceForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const memberId = document.getElementById('memberSelect').value;
  const evenement = document.getElementById('eventName').value;
  const date = document.getElementById('eventDate').value;

  await db.collection('membres').doc(memberId).collection('presences').add({
    evenement, date
  });

  document.getElementById('presenceForm').reset();
  alert('Présence enregistrée.');
});
</script>

</body>
</html>
